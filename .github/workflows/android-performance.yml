name: Android performance evidence

on:
  push:
    branches: [vanta2-perf-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-performance:
    name: Android Macrobenchmark and Baseline Profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            emulator
            platforms;android-37.0
            build-tools;37.0.0
            system-images;android-36;default;x86_64

      - name: Configure non-production Firebase placeholder
        working-directory: android
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "vanta-ci-placeholder",
              "storage_bucket": "vanta-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789abcd",
                "android_client_info": { "package_name": "dev.system.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "ci-placeholder-not-a-secret" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }]
          }
          JSON

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator runtime dependency
        timeout-minutes: 5
        run: |
          timeout 240s sudo apt-get update
          timeout 180s sudo apt-get install --yes libpulse0
          ldconfig -p | grep -F 'libpulse.so.0'

      - name: Create and boot API 36 emulator
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/vanta-perf-metadata"
          exec > >(tee -a "$RUNNER_TEMP/vanta-perf-metadata/emulator-boot-step.log") 2>&1
          export PATH="$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          timeout 15s adb version
          command -v emulator
          timeout 15s emulator -version
          printf 'no\n' | timeout 180s avdmanager create avd --force --name vanta-perf-api36 --package "system-images;android-36;default;x86_64" --device pixel_2
          emulator -avd vanta-perf-api36 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -accel auto > "$RUNNER_TEMP/vanta-perf-emulator.log" 2>&1 &
          emulator_pid=$!
          echo "emulator_pid=$emulator_pid"
          if ! timeout 120s adb wait-for-device; then
            echo "adb wait-for-device timed out or failed"
            tail -n 200 "$RUNNER_TEMP/vanta-perf-emulator.log" || true
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 60); do
            boot_state="$(timeout 5s adb shell getprop sys.boot_completed 2>&1 | tr -d '\r' || true)"
            echo "boot_check=$attempt sys.boot_completed=$boot_state"
            if [ "$boot_state" = "1" ]; then booted=true; break; fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "emulator process exited before boot completed"
              tail -n 200 "$RUNNER_TEMP/vanta-perf-emulator.log" || true
              exit 1
            fi
            sleep 2
          done
          if [ "$booted" != "true" ]; then
            echo "Android system did not report boot completed before 60 bounded checks"
            tail -n 200 "$RUNNER_TEMP/vanta-perf-emulator.log" || true
            exit 1
          fi
          timeout 15s adb shell settings put global window_animation_scale 0
          timeout 15s adb shell settings put global transition_animation_scale 0
          timeout 15s adb shell settings put global animator_duration_scale 0
          {
            timeout 15s adb shell getprop ro.build.fingerprint
            timeout 15s adb shell getprop ro.build.version.release
            timeout 15s adb shell getprop ro.build.version.sdk
            timeout 15s adb shell getprop ro.product.model
            timeout 15s adb shell getprop ro.product.cpu.abi
            timeout 15s adb shell settings get system font_scale
          } > "$RUNNER_TEMP/vanta-perf-metadata/device.txt"

      - name: List benchmark and profile tasks
        timeout-minutes: 15
        working-directory: android
        run: |
          set -o pipefail
          timeout 14m bash ./gradlew --no-daemon :app:tasks --all :benchmark:tasks --all | tee "$RUNNER_TEMP/vanta-perf-metadata/gradle-tasks.txt"

      - name: Generate release-like Baseline Profile
        timeout-minutes: 20
        working-directory: android
        run: timeout 19m bash ./gradlew --no-daemon :app:generateReleaseBaselineProfile

      - name: Assemble release-like profileable target
        timeout-minutes: 20
        working-directory: android
        run: |
          timeout 19m bash ./gradlew --no-daemon :app:assembleBenchmark
          apk=app/build/outputs/apk/benchmark/app-benchmark.apk
          test -f "$apk"
          unzip -Z1 "$apk" | tee "$RUNNER_TEMP/vanta-perf-metadata/benchmark-apk-entries.txt"
          unzip -Z1 "$apk" | grep -E '^assets/dexopt/baseline\.prof(m)?$'

      - name: Run startup, screen-frame, and required-profile Macrobenchmarks
        timeout-minutes: 35
        working-directory: android
        run: timeout 34m bash ./gradlew --no-daemon -PallowEmulatorBenchmarks=true :benchmark:connectedCheck

      - name: Upload benchmark and profile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vanta-batch5-performance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vanta-perf-metadata/**
            ${{ runner.temp }}/vanta-perf-emulator.log
            android/app/src/benchmark/generated/baselineProfiles/**
            android/app/src/main/generated/baselineProfiles/**
            android/app/build/outputs/apk/benchmark/**
            android/benchmark/build/reports/androidTests/**
            android/benchmark/build/outputs/androidTest-results/**
            android/benchmark/build/outputs/connected_android_test_additional_output/**
            android/benchmark/build/outputs/connected_android_test_additional_output/**
            android/benchmark/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

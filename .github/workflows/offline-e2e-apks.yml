name: Offline E2E APKs

on:
  push:
    branches: [main, 'vanta2-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-e2e-apks:
    runs-on: ubuntu-latest
    env:
      VANTA_E2E_SUPABASE_URL: ${{ secrets.VANTA_E2E_SUPABASE_URL }}
      VANTA_E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VANTA_E2E_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Configure non-production Firebase placeholder
        working-directory: android
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "vanta-ci-placeholder",
              "storage_bucket": "vanta-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789abcd",
                "android_client_info": { "package_name": "dev.system.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "ci-placeholder-not-a-secret" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }]
          }
          JSON
      - name: Assemble disposable-config debug and instrumentation APKs
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: vanta-batch51-offline-e2e-apks-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 2

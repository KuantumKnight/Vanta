name: SYSTEM CI

on:
  push:
    branches: [main, 'vanta2-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consent-site:
    name: Consent site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/consent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/consent/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  edge-functions:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config supabase/deno.json supabase/functions/_shared/recurrence_test.ts
        env:
          TZ: UTC
      - run: deno check --config supabase/deno.json supabase/functions/mcp/index.ts supabase/functions/expand-schedules/index.ts supabase/functions/sync-push/index.ts supabase/functions/send-reminders/index.ts

  android:
    name: Android release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space for Android emulator
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          preinstalled-runtimes: false
          swap-storage: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator system-images;android-36;default;x86_64"
      - name: Install Android 17 preview SDK
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"
      - name: Configure non-production Firebase placeholder
        working-directory: android
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "vanta-ci-placeholder",
              "storage_bucket": "vanta-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789abcd",
                "android_client_info": { "package_name": "dev.system.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "ci-placeholder-not-a-secret" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }]
          }
          JSON
      - name: Gradle configuration
        working-directory: android
        run: bash ./gradlew help --no-daemon
      - name: Android JVM unit tests
        working-directory: android
        run: bash ./gradlew testDebugUnitTest --no-daemon
      - name: Android lint
        working-directory: android
        run: bash ./gradlew lintDebug --no-daemon
      - name: Assemble debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Assemble release APK
        working-directory: android
        run: bash ./gradlew assembleRelease --no-daemon
      - name: Compile Android instrumentation APK
        working-directory: android
        run: bash ./gradlew assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests on the Gradle managed device
        working-directory: android
        run: >-
          bash ./gradlew --no-daemon
          -PciManagedDevice=true
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          ciApi36DebugAndroidTest
      - name: Upload Android APKs and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vanta-android-release-gate-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
            android/app/build/reports/lint-results-debug.sarif
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/androidTests/managedDevice/**
            android/app/build/outputs/androidTest-results/managedDevice/**
            android/app/build/outputs/managed_device_android_test_additional_output/**
            android/app/build/intermediates/managed_device_android_test_additional_output/**
            android/app/build/outputs/logs/
            android/app/schemas/
          if-no-files-found: warn
          retention-days: 7

name: SYSTEM CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consent-site:
    name: Consent site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/consent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/consent/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  edge-functions:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config supabase/deno.json supabase/functions/_shared/recurrence_test.ts
        env:
          TZ: UTC
      - run: deno check --config supabase/deno.json supabase/functions/mcp/index.ts supabase/functions/expand-schedules/index.ts supabase/functions/sync-push/index.ts supabase/functions/send-reminders/index.ts

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 platforms;android-37.0 build-tools;37.0.0"
      - name: Configure Firebase Android app
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.SYSTEM_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "vanta-ci-placeholder",
              "storage_bucket": "vanta-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789abcd",
                "android_client_info": { "package_name": "dev.system.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "ci-placeholder-not-a-secret" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }]
          }
          JSON
          else
            echo "::error::Configure SYSTEM_GOOGLE_SERVICES_JSON_B64 to build the Firebase-enabled APK."
            exit 1
          fi
      - name: Assemble, lint, and compile Android tests
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SYSTEM_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SYSTEM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            printf 'SUPABASE_URL=https://example.supabase.co\nSUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder\n' > local.properties
          else
            echo "::error::Configure SYSTEM_SUPABASE_URL and SYSTEM_SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/test.avd/config.ini"
            printf 'disk.dataPartition.size=4G\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: cd android && bash ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: system-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

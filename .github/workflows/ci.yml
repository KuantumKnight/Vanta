name: SYSTEM CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consent-site:
    name: Consent site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/consent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/consent/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  edge-functions:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config supabase/deno.json supabase/functions/_shared/recurrence_test.ts
        env:
          TZ: UTC
      - run: deno check --config supabase/deno.json supabase/functions/mcp/index.ts supabase/functions/expand-schedules/index.ts supabase/functions/sync-push/index.ts supabase/functions/send-reminders/index.ts

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - name: Assemble debug APK
        working-directory: android
        run: |
          printf 'SUPABASE_URL=https://example.supabase.co\nSUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder\n' > local.properties
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: system-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
